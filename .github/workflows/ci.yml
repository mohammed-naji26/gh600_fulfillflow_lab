
name: CI and evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify governance hook runtime
        run: |
          node --version
          node --check .github/hooks/policy-gate.cjs
          test -f .github/hooks/governance.json


      - name: Install MCP test dependency
        run: python -m pip install "mcp==2.3.0"

      - name: Evaluate pull request risk
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          mkdir -p docs/evidence
          mapfile -d '' -t changed < <(
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA"
          )
          if (( ${#changed[@]} == 0 )); then
            echo "No changed paths were found"
            exit 1
          fi
          python scripts/risk_gate.py "${changed[@]}" \
            | tee docs/evidence/risk.json
          test "${PIPESTATUS[0]}" -eq 0

      - name: Evaluate governance drift
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          status=0
          python -m scripts.governance_drift \
            "$BASE_SHA" "$HEAD_SHA" \
            --output docs/evidence/governance_drift.json \
            || status=$?

          if [ "$status" -eq 1 ]; then
            echo "Governance changes detected: human review required"
            exit 0
          fi

          exit "$status"


      - name: Generate current-SHA test evidence
        run: python scripts/evaluate.py

      - name: Upload evaluation and risk evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ github.sha }}

          path: |
            docs/evidence/evaluation.json
            docs/evidence/risk.json
            docs/evidence/governance_drift.json

          if-no-files-found: warn
